<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Laboral - ACIPA C</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .contenedor {
            max-width: 1100px;
            margin: 0 auto;
        }

        .cabecera {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .cabecera h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .cabecera p {
            opacity: 0.9;
            font-size: 15px;
        }

        .contadores {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .caja-contador {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        .caja-contador.verde {
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
        }

        .caja-contador h2 {
            font-size: 42px;
            color: #2d3748;
            margin-bottom: 5px;
        }

        .caja-contador p {
            color: #4a5568;
            font-size: 15px;
        }

        .barra-busqueda {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 25px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .barra-busqueda input,
        .barra-busqueda select {
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s;
        }

        .barra-busqueda input:focus,
        .barra-busqueda select:focus {
            outline: none;
            border-color: #667eea;
        }

        .barra-busqueda input {
            flex: 1;
            min-width: 250px;
        }

        .lista-trabajadores {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 18px;
        }

        .tarjeta {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .tarjeta:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.12);
        }

        .tarjeta .nombre {
            font-size: 18px;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 6px;
        }

        .tarjeta .cargo {
            color: #718096;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .etiqueta-estado {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 15px;
        }

        .etiqueta-estado.presente {
            background: #f0fff4;
            color: #22543d;
            border: 1px solid #9ae6b4;
        }

        .etiqueta-estado.ausente {
            background: #fed7d7;
            color: #742a2a;
            border: 1px solid #feb2b2;
        }

        .botones-accion {
            display: flex;
            gap: 10px;
        }

        .botones-accion button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .botones-accion button:hover {
            opacity: 0.9;
        }

        .btn-presente {
            background-color: #48bb78;
            color: white;
        }

        .btn-ausente {
            background-color: #f56565;
            color: white;
        }

        .mensaje-vacio {
            text-align: center;
            color: white;
            padding: 50px;
            font-size: 18px;
        }

        .oculto {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="contenedor">
    <div class="cabecera">
        <h1>📋 Control Laboral - ACIPA C</h1>
        <p>Directorio de trabajadores y control de asistencia</p>
    </div>

    <!-- CONTADORES -->
    <div class="contadores">
        <div class="caja-contador">
            <h2 id="totalTrabajadores">0</h2>
            <p>Total Trabajadores</p>
        </div>
        <div class="caja-contador verde">
            <h2 id="totalPresentes">0</h2>
            <p>✅ Presentes</p>
        </div>
    </div>

    <!-- BUSQUEDA Y FILTRO -->
    <div class="barra-busqueda">
        <input type="text" id="inputBuscar" placeholder="🔍 Buscar por nombre...">
        <select id="selectCargo">
            <option value="todos">Todos los cargos</option>
        </select>
    </div>

    <!-- LISTA DE TARJETAS -->
    <div id="contenedorTarjetas" class="lista-trabajadores"></div>
    <p id="mensajeSinResultados" class="mensaje-vacio oculto">😕 No se encontraron trabajadores con ese criterio</p>
</div>

<script>
// DATOS DE LOS TRABAJADORES
const trabajadores = [
    { id: 1, nombre: "Ana Sofía Rojas", cargo: "Gerente", presente: true },
    { id: 2, nombre: "Diego Fernández", cargo: "Director", presente: true },
    { id: 3, nombre: "María José Suárez", cargo: "Supervisor", presente: true },
    { id: 4, nombre: "Carlos Andrés Méndez", cargo: "Jefe de Área", presente: false },
    { id: 5, nombre: "Valeria Flores", cargo: "Analista", presente: true },
    { id: 6, nombre: "Mateo Chávez", cargo: "Operador", presente: false },
    { id: 7, nombre: "Lucía Vargas", cargo: "Asistente", presente: true },
    { id: 8, nombre: "Gabriel Ortiz", cargo: "Asistente", presente: true }
];

// ELEMENTOS DEL DOM
const contenedorTarjetas = document.getElementById('contenedorTarjetas');
const inputBuscar = document.getElementById('inputBuscar');
const selectCargo = document.getElementById('selectCargo');
const totalTrabajadores = document.getElementById('totalTrabajadores');
const totalPresentes = document.getElementById('totalPresentes');
const mensajeSinResultados = document.getElementById('mensajeSinResultados');

// CAMBIAR ESTADO DE ASISTENCIA (disponible globalmente para onclick)
window.cambiarAsistencia = function(id, presente) {
    const trabajador = trabajadores.find(t => t.id === id);
    if (trabajador) {
        trabajador.presente = presente;
        mostrarTarjetas();
    }
};

// CARGAR CARGOS ÚNICOS EN EL SELECT
function cargarCargos() {
    const cargosUnicos = [...new Set(trabajadores.map(t => t.cargo))];
    cargosUnicos.forEach(cargo => {
        const opcion = document.createElement('option');
        opcion.value = cargo;
        opcion.textContent = cargo;
        selectCargo.appendChild(opcion);
    });
}

// ACTUALIZAR LOS NÚMEROS
function actualizarContadores() {
    totalTrabajadores.textContent = trabajadores.length;
    const cantidadPresentes = trabajadores.filter(t => t.presente).length;
    totalPresentes.textContent = cantidadPresentes;
}

// RENDERIZAR LAS TARJETAS
function mostrarTarjetas() {
    const textoBusqueda = inputBuscar.value.trim().toLowerCase();
    const cargoSeleccionado = selectCargo.value;

    // Filtrar
    const filtrados = trabajadores.filter(t => {
        const coincideNombre = t.nombre.toLowerCase().includes(textoBusqueda);
        const coincideCargo = cargoSeleccionado === 'todos' || t.cargo === cargoSeleccionado;
        return coincideNombre && coincideCargo;
    });

    // Limpiar
    contenedorTarjetas.innerHTML = '';

    // Mostrar o no mensaje vacío
    if (filtrados.length === 0) {
        mensajeSinResultados.classList.remove('oculto');
    } else {
        mensajeSinResultados.classList.add('oculto');
        
        // Crear cada tarjeta
        filtrados.forEach(t => {
            const tarjeta = document.createElement('div');
            tarjeta.className = 'tarjeta';
            tarjeta.innerHTML = `
                <div class="nombre">${t.nombre}</div>
                <div class="cargo">${t.cargo}</div>
                <div class="etiqueta-estado ${t.presente ? 'presente' : 'ausente'}">
                    ${t.presente ? '✅ Presente' : '❌ Ausente'}
                </div>
                <div class="botones-accion">
                    <button class="btn-presente" onclick="cambiarAsistencia(${t.id}, true)">✓ Presente</button>
                    <button class="btn-ausente" onclick="cambiarAsistencia(${t.id}, false)">✗ Ausente</button>
                </div>
            `;
            contenedorTarjetas.appendChild(tarjeta);
        });
    }

    actualizarContadores();
}

// EVENTOS
inputBuscar.addEventListener('input', mostrarTarjetas);
selectCargo.addEventListener('change', mostrarTarjetas);

// INICIAR LA APLICACIÓN
cargarCargos();
mostrarTarjetas();
</script>

</body>
</html>
